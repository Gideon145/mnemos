[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos"
version = "0.1.0"
description = "An agent that remembers. Durable memory on Sibyl."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sibyl-memory-client==0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
payments = [
    "web3>=7",
]
virtuals = [
    "game-sdk>=0.1.5",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
mnemos = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]
